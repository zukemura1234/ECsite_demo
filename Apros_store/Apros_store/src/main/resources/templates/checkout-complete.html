
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('ご注文完了')}">
    <title>ご注文完了 | アプロスストア</title>
</head>

<body class="">

    <!-- ヘッダー -->
    <header th:replace="~{fragments/layout :: header}"></header>

    <main id="main" class="container page-main">

        <!-- 注文ステップ -->
        <div th:replace="~{fragments/layout :: steps(4)}"></div>

        <!-- 注文完了 -->
        <section class="completion">

            <!-- 完了アイコン -->
            <div class="success-icon" aria-hidden="true">
                ✓
            </div>

            <!-- 完了メッセージ -->
            <p class="eyebrow">THANK YOU FOR YOUR ORDER</p>

            <h1>ご注文ありがとうございます。</h1>

            <p class="muted">
                アプロスストアでのご注文を受け付けました。
            </p>

            <!-- 注文情報 -->
            <div class="panel receipt">

                <dl class="totals">

                    <!-- 注文番号 -->
                    <div>
                        <dt>注文番号</dt>
                        <dd th:text="${order.id}">—</dd>
                    </div>

                    <!-- 注文日時 -->
                    <div>
                        <dt>注文日時</dt>
                        <dd th:text="${#temporals.format(order.orderedAt, 'yyyy/MM/dd HH:mm')}">
                            —
                        </dd>
                    </div>

                    <!-- 注文状況 -->
                    <div>
                        <dt>注文状況</dt>
                        <dd>
                            <span class="status-pill"
                                  th:text="${order.status}">
                                受付済み
                            </span>
                        </dd>
                    </div>

                </dl>

                <!-- 合計金額 -->
                <div class="grand-total">

                    <span>合計金額</span>

                    <strong>
                        <span th:text="${#numbers.formatInteger(order.totalPrice, 1, 'COMMA')}">
                            0
                        </span>
                        <small>円</small>
                    </strong>

                </div>

            </div>

            <!-- デモサイトの注意書き -->
            <p class="notice">
                このサイトは学習用デモです。
                <br>
                実際の決済・配送・注文メールの送信はありません。
            </p>

            <!-- 商品一覧へ戻る -->
            <a class="button primary" th:href="@{/#products}">
                お買い物を続ける →
            </a>

        </section>

    </main>

    <!-- フッター -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
