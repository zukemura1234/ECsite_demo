
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('ログイン')}">
    <title>ログイン | アプロスストア</title>
</head>

<body class="">

    <!-- ヘッダー -->
    <header th:replace="~{fragments/layout :: header}"></header>

    <main id="main" class="container auth-main">

        <!-- 左側：ログイン紹介 -->
        <div class="auth-intro">

            <p class="eyebrow">WELCOME BACK</p>

            <h1>おかえりなさい。</h1>

            <p>
                いつものお買い物を、
                <br>
                アプロスストアで。
            </p>

            <img th:src="@{/images/everyday.svg}"
                 alt="毎日の暮らしに寄りそうアプロスのバッグ"
                 width="420"
                 height="338">

        </div>

        <!-- 右側：ログインフォーム -->
        <section class="panel auth-card">

            <h2>ログイン</h2>

            <p class="muted">
                登録したメールアドレスでログインしてください。
            </p>

            <!-- 会員登録完了メッセージ -->
            <p class="notice" th:if="${param.registered}">
                会員登録が完了しました。ログインしてください。
            </p>

            <!-- ログインフォーム -->
            <form th:action="@{/login}"
                  th:object="${users}"
                  method="post"
                  data-submit-once>

                <!-- ログイン後の遷移先 -->
                <input type="hidden"
                       name="next"
                       th:value="${param.next != null ? param.next[0] : ''}">

                <!-- ログインエラー -->
                <p class="alert"
                   th:if="${#fields.hasGlobalErrors()}"
                   th:each="error : ${#fields.globalErrors()}"
                   th:text="${error}"
                   role="alert">
                </p>

                <!-- メールアドレス -->
                <div class="field">

                    <label for="email">
                        メールアドレス
                    </label>

                    <input id="email"
                           type="email"
                           th:field="*{email}"
                           autocomplete="username"
                           placeholder="example@email.com"
                           required>

                    <p class="field-error"
                       th:if="${#fields.hasErrors('email')}"
                       th:errors="*{email}">
                    </p>

                </div>

                <!-- パスワード -->
                <div class="field">

                    <label for="password">
                        パスワード
                    </label>

                    <div class="password-wrap">

                        <input id="password"
                               type="password"
                               name="password"
                               autocomplete="current-password"
                               required>

                        <!-- パスワード表示切り替え -->
                        <button class="password-toggle"
                                type="button"
                                aria-controls="password"
                                aria-pressed="false">
                            表示
                        </button>

                    </div>

                    <p class="field-error"
                       th:if="${#fields.hasErrors('password')}"
                       th:errors="*{password}">
                    </p>

                </div>

                <!-- ログインボタン -->
                <button class="button primary full" type="submit">
                    ログイン →
                </button>

            </form>
			
			<a th:href="@{/password-reset}">
			    パスワードを忘れた方はこちら
			</a>

            <!-- 新規会員登録 -->
            <div class="auth-bottom">

                <p>はじめてご利用の方</p>

                <a class="button secondary full"
                   th:href="@{/register(next=${param.next != null ? param.next[0] : ''})}">
                    新規会員登録
                </a>

            </div>

            <!-- 商品一覧に戻る -->
            <a class="back-link" th:href="@{/}">
                ← 商品一覧に戻る
            </a>

        </section>

    </main>

    <!-- フッター -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
