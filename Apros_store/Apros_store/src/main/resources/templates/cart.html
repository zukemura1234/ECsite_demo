
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('ショッピングカート')}">
    <title>ショッピングカート | アプロスストア</title>
</head>

<body class="">

    <!-- ヘッダー -->
    <header th:replace="~{fragments/layout :: header}"></header>

    <main id="main" class="container page-main">

        <!-- パンくずリスト -->
        <nav class="breadcrumb" aria-label="パンくず">
            <a th:href="@{/}">ホーム</a>
            <span>/</span>
            カート
        </nav>

        <!-- 注文ステップ -->
        <div th:replace="~{fragments/layout :: steps(1)}"></div>

        <!-- ページタイトル -->
        <div class="page-heading">

            <p class="eyebrow">SHOPPING CART</p>

            <h1>ショッピングカート</h1>

            <p>
                数量と金額を確認して、レジにお進みください。
            </p>

        </div>

        <!-- カートが空の場合 -->
        <div th:if="${cartItems.isEmpty()}"
             class="panel empty-state">

            <span class="empty-icon">＋</span>

            <h2>カートはまだ空です</h2>

            <p>
                気になる商品を見つけて、お買い物を始めましょう。
            </p>

            <a class="button primary" th:href="@{/#products}">
                商品を探す →
            </a>

        </div>

        <!-- カートに商品がある場合 -->
        <div th:unless="${cartItems.isEmpty()}"
             class="checkout-grid">

            <!-- 左側：カート内の商品一覧 -->
            <div>

                <!-- 商品一覧（数量変更あり） -->
                <section th:replace="~{fragments/layout :: items(true)}"></section>

                <!-- 商品一覧へ戻る -->
                <a class="back-link" th:href="@{/#products}">
                    ← お買い物を続ける
                </a>

                <!-- 数量変更についての説明 -->
                <p class="muted tiny">
                    数量を1から減らすと、その商品をカートから削除します。
                </p>

            </div>

            <!-- 右側：注文金額・レジへ進む -->
            <div class="sticky-column">

                <!-- 注文金額のサマリー -->
                <aside th:replace="~{fragments/layout :: summary}"></aside>

                <!-- レジへ進む -->
                <a class="button primary full" th:href="@{/checkout}">
                    レジに進む
                    <span aria-hidden="true">→</span>
                </a>

                <!-- 未ログインの場合の案内 -->
                <p class="muted tiny centered"
                   th:if="${session.userId == null}">
                    ご注文にはログインが必要です。
                </p>

            </div>

        </div>

    </main>

    <!-- フッター -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
