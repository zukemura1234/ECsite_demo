
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('新規会員登録')}">
    <title>新規会員登録 | アプロスストア</title>
</head>

<body class="">

    <!-- ヘッダー -->
    <header th:replace="~{fragments/layout :: header}"></header>

    <main id="main" class="container registration-main">

        <!-- ページタイトル -->
        <div class="page-heading centered">

            <p class="eyebrow">JOIN APROS</p>

            <h1>新規会員登録</h1>

            <p>
                お届け先を登録して、お買い物をスムーズに。
            </p>

        </div>

        <!-- 会員登録フォーム -->
        <form class="panel registration-card"
              th:action="@{/register}"
              th:object="${user}"
              method="post"
              data-submit-once>

            <!-- 登録後の遷移先 -->
            <input type="hidden"
                   name="next"
                   th:value="${param.next != null ? param.next[0] : ''}">

            <!-- 01：アカウント情報 -->
            <h2>
                <span class="section-number">01</span>
                アカウント情報
            </h2>

            <!-- メールアドレス -->
            <div class="field">

                <label for="email">
                    メールアドレス
                    <span class="required">必須</span>
                </label>

                <input id="email"
                       type="email"
                       th:field="*{email}"
                       autocomplete="email"
                       placeholder="example@email.com"
                       required>

                <p class="field-error"
                   th:if="${emailError}"
                   th:text="${emailError}"
                   role="alert">
                </p>

            </div>

            <!-- パスワード -->
            <div class="field">

                <label for="password">
                    パスワード
                    <span class="required">必須</span>
                </label>

                <div class="password-wrap">

                    <input id="password"
                           type="password"
                           name="password"
                           minlength="8"
                           autocomplete="new-password"
                           aria-describedby="password-hint"
                           required>

                    <!-- パスワード表示切り替え -->
                    <button class="password-toggle"
                            type="button"
                            aria-controls="password"
                            aria-pressed="false">
                        表示
                    </button>

                </div>

                <p class="hint" id="password-hint">
                    8文字以上で入力してください。
                </p>

                <p class="field-error"
                   th:if="${passwordError}"
                   th:text="${passwordError}"
                   role="alert">
                </p>

            </div>

            <hr>

            <!-- 02：お名前・お届け先 -->
            <h2>
                <span class="section-number">02</span>
                お名前・お届け先
            </h2>

            <div class="form-grid">

                <!-- お名前 -->
                <div class="field wide">

                    <label for="name">
                        お名前
                        <span class="required">必須</span>
                    </label>

                    <input id="name"
                           type="text"
                           th:field="*{name}"
                           class=""
                           placeholder="例：山田 太郎"
                           autocomplete="name"
                           required>

                    <p class="field-error"
                       th:if="${nameError}"
                       th:text="${nameError}"
                       role="alert">
                    </p>

                </div>

                <!-- 郵便番号 -->
                <div class="field">

                    <label for="postalCode">
                        郵便番号
                        <span class="required">必須</span>
                    </label>

                    <input id="postalCode"
                           type="text"
                           th:field="*{postalCode}"
                           class="p-postal-code"
                           placeholder="例：9011303"
                           autocomplete="postal-code"
                           required
                           inputmode="numeric"
                           pattern="[0-9]{3}-?[0-9]{4}"
                           maxlength="8"
                           aria-describedby="postal-hint">

                    <p class="field-error"
                       th:if="${postalCodeError}"
                       th:text="${postalCodeError}"
                       role="alert">
                    </p>

                    <p class="hint" id="postal-hint">
                        7桁の郵便番号（ハイフン可）
                    </p>

                </div>

                <!-- 都道府県 -->
                <div class="field">

                    <label for="prefecture">
                        都道府県
                        <span class="required">必須</span>
                    </label>

                    <input id="prefecture"
                           type="text"
                           th:field="*{prefecture}"
                           class="p-region"
                           placeholder="例：沖縄県"
                           autocomplete="address-level1"
                           required>

                    <p class="field-error"
                       th:if="${prefectureError}"
                       th:text="${prefectureError}"
                       role="alert">
                    </p>

                </div>

                <!-- 市区町村 -->
                <div class="field">

                    <label for="city">
                        市区町村
                        <span class="required">必須</span>
                    </label>

                    <input id="city"
                           type="text"
                           th:field="*{city}"
                           class="p-locality"
                           placeholder="例：島尻郡与那原町"
                           autocomplete="address-level2"
                           required>

                    <p class="field-error"
                       th:if="${cityError}"
                       th:text="${cityError}"
                       role="alert">
                    </p>

                </div>

                <!-- 町域・番地 -->
                <div class="field wide">

                    <label for="addressLine">
                        町域・番地
                        <span class="required">必須</span>
                    </label>

                    <input id="addressLine"
                           type="text"
                           th:field="*{addressLine}"
                           class="p-street-address"
                           placeholder="例：与那原1-2-3"
                           autocomplete="address-line1"
                           required>

                    <p class="field-error"
                       th:if="${addressLineError}"
                       th:text="${addressLineError}"
                       role="alert">
                    </p>

                </div>

                <!-- 建物名・部屋番号 -->
                <div class="field wide">

                    <label for="building">
                        建物名・部屋番号
                        <span class="optional">任意</span>
                    </label>

                    <input id="building"
                           type="text"
                           th:field="*{building}"
                           class=""
                           placeholder="例：アプロスハイツ 101号室"
                           autocomplete="address-line2">

                    <p class="field-error"
                       th:if="${buildingError}"
                       th:text="${buildingError}"
                       role="alert">
                    </p>

                </div>

            </div>

            <!-- デモサイトの注意書き -->
            <p class="notice">
                学習用デモでは、架空の情報でお試しください。
            </p>

            <!-- 会員登録ボタン -->
            <button class="button primary full" type="submit">
                会員登録する →
            </button>

            <!-- ログインへのリンク -->
            <p class="centered tiny">
                すでに会員の方は
                <a th:href="@{/login(next=${param.next != null ? param.next[0] : ''})}">
                    ログイン
                </a>
            </p>

        </form>

    </main>

    <!-- フッター -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
