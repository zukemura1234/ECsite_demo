<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>パスワード変更 | Apros_store</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #f7f7f7;
            color: #333;
        }
        .reset-container {
            width: min(420px, calc(100% - 40px));
            margin: 60px auto;
            padding: 32px;
            box-sizing: border-box;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .08);
        }
        h1 { margin: 0 0 12px; text-align: center; font-size: 24px; }
        .description { margin-bottom: 28px; text-align: center; color: #666; font-size: 14px; }
        label { display: block; margin: 18px 0 7px; font-weight: bold; font-size: 14px; }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        .error { margin: 6px 0 0; color: #c62828; font-size: 13px; }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: 0;
            border-radius: 5px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        .back { margin-top: 20px; text-align: center; font-size: 14px; }
        a { color: #2563eb; }
    </style>
</head>
<body>
<main class="reset-container">
    <h1>パスワード変更</h1>
    <p class="description">登録済みのメールアドレスと新しいパスワードを入力してください。</p>

    <form th:action="@{/password-reset}" th:object="${passwordResetForm}" method="post">
        <label for="email">メールアドレス</label>
        <input id="email" type="email" th:field="*{email}" autocomplete="email" required>
        <p class="error" th:if="${emailError}" th:text="${emailError}"></p>

        <label for="newPassword">新しいパスワード（8文字以上）</label>
        <input id="newPassword" type="password" th:field="*{newPassword}"
               autocomplete="new-password" minlength="8" required>
        <p class="error" th:if="${passwordError}" th:text="${passwordError}"></p>

        <label for="confirmPassword">新しいパスワード（確認用）</label>
        <input id="confirmPassword" type="password" th:field="*{confirmPassword}"
               autocomplete="new-password" minlength="8" required>
        <p class="error" th:if="${confirmPasswordError}" th:text="${confirmPasswordError}"></p>

        <button type="submit">パスワードを変更する</button>
    </form>

    <p class="back"><a th:href="@{/login}">ログイン画面に戻る</a></p>
</main>
</body>
</html>
